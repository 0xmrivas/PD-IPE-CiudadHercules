# Programaciones didácticas de IPE I e IPE II
# IES Ciudad de Hércules · Chiclana de la Frontera
#
# Cada entrada de `programaciones` es UN documento (un PDF) para todos sus grupos.
# Todas comparten el índice (`apartados`). Cada apartado o fragmento se busca en
# estas carpetas, en este orden, y entra el PRIMERO que exista:
#
#   pd/<programación>/<nombre>.md   solo esta programación
#   modulos/<módulo>/<nombre>.md    este módulo
#   ciclos/<ciclo>/<nombre>.md      cualquier programación de este ciclo
#   comun/<nombre>.md               todas
#
# Una programación puede abarcar varios ciclos (`ciclos: [ga, af]`): IPE I es
# una sola PD para los grupos de GM y de GS. Lo que depende del título se inserta
# una vez por ciclo con <!-- por-ciclo: <fragmento> [titulo=N] -->, buscado en
# pd/<programación>/<ciclo>/ → pd/<programación>/ → modulos/ → ciclos/<ciclo>/ → comun/.
#
# Lo de cada grupo vive en grupos/<curso><ciclo>-<letra>/ (p. ej. grupos/1ga-a/)
# y se inserta una vez por grupo con <!-- por-grupo: <fragmento> -->.
#
# Dentro de cualquier archivo:
#   <!-- incluir: <fragmento> -->    inserta otro archivo, buscado con la misma cascada
#   <!-- por-grupo: <fragmento> -->  inserta grupos/<grupo>/<fragmento>.md de cada grupo
#   <!-- por-ciclo: <fragmento> -->  inserta el fragmento de cada ciclo de la programación
#   {{ciclo}}, {{modulo}}, {{codigo}}, {{horas}}, {{grupos}}…  datos de este manifiesto
#   {{grupo}}, {{letra}}             dentro de un fragmento de grupo, los de ese grupo
schema_version: 2

documento:
  centro: "IES Ciudad de Hércules"
  codigo_centro: "11700354"
  localidad: "Chiclana de la Frontera (Cádiz)"
  departamento: "Departamento de Administración"
  docente: "Laura González Kämerow"
  jefatura: "Manuel Jesús Puerto Crespo"
  familia: "Administración y Gestión"
  curso_academico: "2026/2027"
  version: "borrador-02"

# Registro de versiones, al final de cada PD (como en la PD del CE de Ciberseguridad).
# Una fila por redacción o revisión; `programaciones` limita la fila a esas PD (sin él, a todas).
versiones:
  - responsables: ["González Kämerow, Laura"]
    accion: "Redactado"
    fecha: "13/10/2026"
    version: "1.0"
    programaciones: [ipe1]
  - responsables: ["González Kämerow, Laura"]
    accion: "Redactado"
    fecha: "[Fecha]"
    version: "1.0"
    programaciones: [ipe2-gs]

apartados:
  - introduccion
  - contexto
  - identificacion
  - resultados
  - contenidos
  - metodologia
  - evaluacion
  - actividades
  - diversidad
  - seguimiento
  - interdisciplinariedad
  - plan-formativo
  - plan-lector
  - anexo-moviles

modulos:
  ipe1:
    codigo: "1709"
    titulo: "Itinerario personal para la empleabilidad I"
    corto: "IPE I"
  ipe2:
    codigo: "1710"
    titulo: "Itinerario personal para la empleabilidad II"
    corto: "IPE II"

ciclos:
  ga:
    titulo: "Técnico en Gestión Administrativa"
    corto: "CFGM Gestión Administrativa"
    grado: "Grado medio"
    nivel: "GM"
  af:
    titulo: "Técnico Superior en Administración y Finanzas"
    corto: "CFGS Administración y Finanzas"
    grado: "Grado superior"
    nivel: "GS"

programaciones:
  # IPE I: una PD para los cuatro grupos de primero (GM A y B, GS A y B)
  - id: ipe1
    modulo: ipe1
    ciclos: [ga, af]
    curso: 1
    horas: 96
    horas_semana: 3
    ects: {af: 5}
    grupos: ["A", "B"]        # en cada ciclo
  # La Resolución de 24 de julio de 2026 elimina la cifra de 105 h: se mantienen las 3 h semanales.
  - id: ipe2-gs
    modulo: ipe2
    ciclo: af
    curso: 2
    horas: 96
    horas_semana: 3
    grupos: ["A", "B"]
