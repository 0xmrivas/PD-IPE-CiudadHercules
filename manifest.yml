# Programaciones didácticas individuales de IPE I e IPE II
# IES Ciudad de Hércules · Chiclana de la Frontera
#
# Cada entrada de `programaciones` genera un PDF propio. Todas comparten el mismo
# índice (`apartados`) y cada apartado se busca en estas carpetas, en este orden;
# entra en la PD el PRIMERO que exista:
#
#   grupos/<grupo>/<apartado>.md          solo este grupo
#   modulos/<módulo>/<ciclo>/<apartado>.md  este módulo en este ciclo
#   modulos/<módulo>/<apartado>.md         este módulo, en cualquier ciclo
#   ciclos/<ciclo>/<apartado>.md           cualquier módulo de este ciclo
#   comun/<apartado>.md                    todas las programaciones
#
# Para que un grupo tenga algo distinto basta con copiar el archivo a su carpeta
# de grupos/ y cambiarlo. Dentro de cualquier archivo:
#   <!-- incluir: <fragmento> -->   inserta otro archivo, buscado con la misma cascada
#   {{grupo}}, {{curso}}, {{ciclo}}, {{modulo}}, {{codigo}}, {{horas}}...  datos del manifiesto
schema_version: 1

documento:
  centro: "IES Ciudad de Hércules"
  codigo_centro: "11700354"
  localidad: "Chiclana de la Frontera (Cádiz)"
  departamento: "Departamento de Administración"
  docente: "Laura González Kåmerow"
  curso_academico: "2026/2027"
  version: "borrador-01"

apartados:
  - introduccion
  - contexto
  - identificacion
  - resultados
  - contenidos
  - metodologia
  - evaluacion
  - actividades
  - diversidad
  - seguimiento
  - interdisciplinariedad
  - plan-formativo
  - plan-lector
  - anexo-moviles

modulos:
  ipe1:
    codigo: "1709"
    titulo: "Itinerario personal para la empleabilidad I"
    corto: "IPE I"
  ipe2:
    codigo: "1710"
    titulo: "Itinerario personal para la empleabilidad II"
    corto: "IPE II"

ciclos:
  ga:
    titulo: "Técnico en Gestión Administrativa"
    corto: "CFGM Gestión Administrativa"
    grado: "Grado medio"
  af:
    titulo: "Técnico Superior en Administración y Finanzas"
    corto: "CFGS Administración y Finanzas"
    grado: "Grado superior"

programaciones:
  - grupo: 1ga-a
    modulo: ipe1
    ciclo: ga
    curso: 1
    letra: "A"
    horas: 96
    horas_semana: 3
  - grupo: 1ga-b
    modulo: ipe1
    ciclo: ga
    curso: 1
    letra: "B"
    horas: 96
    horas_semana: 3
  - grupo: 1af-a
    modulo: ipe1
    ciclo: af
    curso: 1
    letra: "A"
    horas: 96
    horas_semana: 3
  - grupo: 1af-b
    modulo: ipe1
    ciclo: af
    curso: 1
    letra: "B"
    horas: 96
    horas_semana: 3
  # Horas de IPE II: tomadas de la PD 2025/26 del centro (2.º GM). Confirmar para 2.º GS.
  - grupo: 2af
    modulo: ipe2
    ciclo: af
    curso: 2
    horas: 105
    horas_semana: null   # por confirmar
